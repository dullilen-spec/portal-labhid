# Publica el portal en GitHub Pages cada vez que se sube un cambio a la rama main.
# Si la construcción falla, no se publica nada y queda el sitio anterior.
name: Publicar portal

on:
  push:
    branches: [main]
    # v05: las mediciones de la hoja de campo no cambian el sitio
    paths-ignore:
      - "campo/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Instalar dependencias
        run: npm ci
        working-directory: portal
      # v05b: si se subió el Excel maestro a datos/, los datos salen de él (con sus revisiones de privacidad)
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Datos desde el Excel maestro (si se subió)
        run: |
          if [ -f datos/Maestro_Bienes_LABHID.xlsx ]; then
            pip install --quiet openpyxl==3.1.5
            python scripts/excel_a_json.py datos/Maestro_Bienes_LABHID.xlsx portal/public/datos/bienes.json
          else
            echo "Sin Excel en datos/: se publica portal/public/datos/bienes.json tal como está."
          fi
      # v05b: si se subió un IFC a modelo_fuente/, el Mapa 3D sale de él
      - name: Modelo 3D desde el IFC (si se subió)
        env:
          RUMBO_X: "131.1079"
        run: |
          n=$(ls modelo_fuente/*.ifc 2>/dev/null | wc -l)
          if [ "$n" -gt 1 ]; then echo "Hay $n archivos IFC en modelo_fuente/: deja solo uno."; exit 1; fi
          if [ "$n" -eq 1 ]; then
            IFC=$(ls modelo_fuente/*.ifc)
            node scripts/ifc_indice.mjs "$IFC" portal/public/modelo/indice_modelo.json --rumbo-x=$RUMBO_X
            node scripts/ifc_a_frag.mjs "$IFC" portal/public/modelo/modelo.frag
          else
            echo "Sin IFC en modelo_fuente/: se publica el modelo de portal/public/modelo tal como está."
          fi
      - name: Revisar que el modelo y los datos coincidan
        run: |
          node -e '
            const fs = require("fs");
            const datos = new Set(JSON.parse(fs.readFileSync("portal/public/datos/bienes.json")).bienes.map((b) => b.Codigo_LH));
            const ind = JSON.parse(fs.readFileSync("portal/public/modelo/indice_modelo.json"));
            const faltan = Object.keys(ind.bienes).filter((c) => !datos.has(c));
            if (faltan.length) { console.error("El modelo tiene códigos que no están en los datos:", faltan.join(", ")); process.exit(1); }
            console.log("Modelo y datos coinciden:", Object.keys(ind.bienes).length, "bienes en el 3D");
          '
      - name: Revisar las actualizaciones del panel
        run: node scripts/validar_actualizaciones.mjs
      - name: Construir el sitio
        run: npm run build
        working-directory: portal
      - name: Revisar que no se publiquen datos privados
        run: |
          # Los datos publicados no deben traer columnas de control interno ni patrimoniales
          for f in portal/dist/datos/bienes.json portal/dist/datos/actualizaciones.json; do
            [ -f "$f" ] || continue
            if grep -qiE '"(codigo_patrimonial|cod_patrimonial|valor_adquisicion|precio|costo|responsable|dni|resolucion)"[[:space:]]*:' "$f"; then
              echo "$f trae una columna privada. No se publica."; exit 1
            fi
            # Un número de 12 dígitos seguidos es un código patrimonial
            if grep -qE '(^|[^0-9])[0-9]{12}([^0-9]|$)' "$f"; then
              echo "$f trae un número de 12 dígitos, como un código patrimonial. No se publica."; exit 1
            fi
          done
          # El modelo 3D no debe llevar parámetros ni códigos internos
          if grep -qa "LH_Codigo" portal/dist/modelo/modelo.frag; then
            echo "modelo.frag trae parámetros del modelo. No se publica."; exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portal/dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
