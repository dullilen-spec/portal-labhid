# Publica el portal en GitHub Pages cada vez que se sube un cambio a la rama main.
# Si la construcción falla, no se publica nada y queda el sitio anterior.
name: Publicar portal

on:
  push:
    branches: [main]
    # v05: las mediciones de la hoja de campo no cambian el sitio
    paths-ignore:
      - "campo/**"
      - "*.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: portal/package-lock.json
      - name: Instalar dependencias
        run: npm ci
        working-directory: portal
      - name: Revisar las actualizaciones del panel
        run: node scripts/validar_actualizaciones.mjs
      - name: Construir el sitio
        run: npm run build
        working-directory: portal
      - name: Revisar que no se publiquen datos privados
        run: |
          # Los datos publicados no deben traer columnas de control interno ni patrimoniales
          for f in portal/dist/datos/bienes.json portal/dist/datos/actualizaciones.json; do
            [ -f "$f" ] || continue
            if grep -qiE '"(codigo_patrimonial|cod_patrimonial|valor_adquisicion|precio|costo|responsable|dni|resolucion)"[[:space:]]*:' "$f"; then
              echo "$f trae una columna privada. No se publica."; exit 1
            fi
            # Un número de 12 dígitos seguidos es un código patrimonial
            if grep -qE '(^|[^0-9])[0-9]{12}([^0-9]|$)' "$f"; then
              echo "$f trae un número de 12 dígitos, como un código patrimonial. No se publica."; exit 1
            fi
          done
          # El modelo 3D no debe llevar parámetros ni códigos internos
          if grep -qa "LH_Codigo" portal/dist/modelo/modelo.frag; then
            echo "modelo.frag trae parámetros del modelo. No se publica."; exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: portal/dist

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
